services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: sangam, POSTGRES_USER: sangam, POSTGRES_PASSWORD: sangam}
    ports: ["5434:5432"]
    volumes:
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
