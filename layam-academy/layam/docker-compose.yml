services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: layam
      POSTGRES_USER: layam
      POSTGRES_PASSWORD: layam
    ports: ["5433:5432"]
    volumes:
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
